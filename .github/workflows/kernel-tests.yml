name: Studio Kernel Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Core regression tests (no cloud AI billing)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile core
        run: python -m compileall -q app

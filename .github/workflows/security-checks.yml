name: Studio Source Hygiene
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Fail on obvious local state or credential files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|\.studio/|__pycache__/|id_rsa$|id_ed25519$|.*\.pem$|\.npmrc$)' ; then
            echo 'Potential secret/local state file detected'; exit 1
          fi
          python -m compileall -q app
      - name: Verify gitignore present
        run: test -f .gitignore

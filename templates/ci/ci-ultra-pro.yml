name: Ultra Pro Studio - Kontroller
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultra-pro-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Proje ve motor kontrolleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Yapısal denetim (AI çağrısı yok)
        run: python .github/scripts/ci_check.py
      - name: Godot 4.5.2 resmi headless binary
        if: hashFiles('project.godot') != ''
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.5.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --headless --path . --editor --quit
      - uses: subosito/flutter-action@v2
        if: hashFiles('pubspec.yaml') != ''
        with:
          channel: stable
      - name: Flutter analiz ve test
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter pub get
          flutter analyze
          if [ -d test ]; then flutter test; else echo 'Flutter test/ yok, test yapilmadi'; fi
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: '22'
          cache: npm
      - name: Web npm test ve build
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci --ignore-scripts
          npm test --if-present
          npm run build --if-present
      - uses: actions/setup-java@v4
        if: hashFiles('gradlew') != ''
        with:
          distribution: temurin
          java-version: '17'
      - name: Android Gradle test
        if: hashFiles('gradlew') != ''
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
